; PlatformIO Project Configuration File
;
; framework = espidf (pure ESP-IDF, no Arduino core).
;
; Why not Arduino/hybrid: this display stack needs ESP-IDF >= 5.5
; (esp_lcd_panel_rgb num_fbs/bounce-buffer fields, the new
; i2c_master.h driver, esp_lcd_touch_gt911, esp_lvgl_adapter, LVGL
; 9.1). The PlatformIO espressif32 platform installed here only ships
; ESP-IDF 4.4.7 for the `framework = arduino` / `arduino, espidf`
; combinations (verified by an actual build attempt: esp_lvgl_adapter
; requires idf>=5.5 and version solving fails against 4.4.7), so
; neither pure Arduino nor the Arduino+ESP-IDF hybrid can build this
; driver stack on this toolchain. Plain `framework = espidf` uses a
; newer, unconstrained ESP-IDF release and keeps the RGB panel/GT911
; touch/LVGL code untouched.
;
; Networking (components/coreiot_client) still follows the same
; non-blocking, FreeRTOS-task-based shape as firmware/sensor-node's
; CoreiotClient (see src/main.c's networkTask), just implemented with
; esp_wifi/esp-mqtt instead of WiFi.h/PubSubClient since there is no
; Arduino core in this build.
;
; This still requires the ESP-IDF CMake component-project layout
; (CMakeLists.txt, src/, components/*, sdkconfig.defaults) rather than
; the plain src/include/lib PlatformIO layout used by
; firmware/sensor-node - PlatformIO's ESP-IDF builder always expects
; that layout, framework=arduino or not.
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:yolo_uno]
platform = espressif32
board = yolo_uno
framework = espidf
monitor_speed = 115200

board_build.partitions = partitions.csv
